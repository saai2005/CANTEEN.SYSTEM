services:
  - type: web
    name: mpstme-canteen
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: HOST
        value: 0.0.0.0
      - key: CANTEEN_DATA_DIR
        value: /tmp/canteen-data
      - key: CANTEEN_ADMIN_USERNAME
        value: canteen-admin
      - key: CANTEEN_ADMIN_NAME
        value: Canteen Admin
      - key: CANTEEN_ADMIN_PASSWORD
        sync: false
      - key: CANTEEN_DEMO_USERNAME
        value: saai
      - key: CANTEEN_DEMO_NAME
        value: Sai Demo
      - key: CANTEEN_DEMO_PASSWORD
        sync: false
